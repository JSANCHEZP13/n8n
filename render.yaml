services:
  - type: web
    name: n8n-workflow-automation
    runtime: node
    plan: starter
    region: oregon
    disk:
      name: n8n-data
      mountPath: /data
      sizeGB: 1
    buildCommand: |
      echo "🔧 Installing dependencies..."
      pnpm install --frozen-lockfile
      echo "🏗️ Building n8n for production..."
      pnpm build:deploy > build.log 2>&1
      echo "✅ Build completed successfully"
    startCommand: node start-render.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: sqlite
      - key: DB_SQLITE_DATABASE
        value: /data/database.sqlite
      - key: DB_SQLITE_POOL_SIZE
        value: 3
      - key: DB_SQLITE_ENABLE_WAL
        value: true
      - key: EXECUTIONS_PROCESS
        value: main
      - key: EXECUTIONS_MODE
        value: regular
      - key: N8N_METRICS
        value: true
      - key: N8N_LOG_LEVEL
        value: info
    healthCheckPath: /healthz
    autoDeploy: true
