services:
  - type: web
    name: n8n-workflow-automation
    runtime: node
    plan: starter
    region: oregon
    buildCommand: |
      echo "🔧 Installing dependencies..."
      pnpm install --frozen-lockfile
      echo "🏗️ Building n8n for production..."
      pnpm build:deploy > build.log 2>&1
      echo "✅ Build completed successfully"
    startCommand: node start-render.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password
      - key: EXECUTIONS_PROCESS
        value: main
      - key: EXECUTIONS_MODE
        value: regular
      - key: N8N_METRICS
        value: true
      - key: N8N_LOG_LEVEL
        value: info
    healthCheckPath: /healthz
    autoDeploy: true

databases:
  - name: n8n-postgres
    databaseName: n8n
    user: n8n
    plan: starter
    region: oregon
