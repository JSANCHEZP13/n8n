services:
  - type: web
    name: n8n-workflow-automation
    runtime: node
    plan: starter
    region: oregon
    nodeVersion: "22.12.0"
    buildCommand: |
      echo "🔧 Installing dependencies..."
      pnpm install --frozen-lockfile
      echo "🏗️ Building n8n..."
      pnpm build
      echo "✅ Build completed successfully"
    startCommand: node packages/cli/bin/n8n start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: N8N_PORT
        value: 10000
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: n8n-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-postgres
          property: password
      - key: EXECUTIONS_PROCESS
        value: main
      - key: EXECUTIONS_MODE
        value: regular
      - key: N8N_METRICS
        value: true
      - key: N8N_LOG_LEVEL
        value: info
    healthCheckPath: /healthz
    autoDeploy: true

databases:
  - name: n8n-postgres
    databaseName: n8n
    user: n8n
    plan: basic-256mb
    region: oregon
